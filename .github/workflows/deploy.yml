name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main

env:
  # TODO: Replace with your Google Cloud Project ID
  PROJECT_ID: letterstorm-project 
  # TODO: Replace with your Artifact Registry name (e.g., my-repo)
  GAR_NAME: letterstorm-repo 
  # TODO: Replace with your Google Cloud Region (e.g., us-central1)
  GAR_LOCATION: us-central1 
  # TODO: Replace with your desired Cloud Run service name
  SERVICE: letterstorm-app
  # TODO: Replace with your Google Cloud Region (e.g., us-central1)
  REGION: us-central1 
  
  # Workload Identity Federation settings
  # TODO: Create a Workload Identity Pool and Provider in GCP and add its name here
  # Example: projects/123456789/locations/global/workloadIdentityPools/my-pool/providers/my-provider
  WORKLOAD_IDENTITY_PROVIDER: projects/212686138659/locations/global/workloadIdentityPools/github-pool/providers/github-provider 
  # TODO: Service account email that has permissions to push to GAR and deploy to Cloud Run
  SERVICE_ACCOUNT: github-actions-sa@letterstorm-project.iam.gserviceaccount.com

jobs:
  deploy:
    # Add 'id-token' with the intended permissions for workload identity federation
    permissions:
      contents: 'read'
      id-token: 'write'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter (optional, uncomment to enable)
        run: npm run lint

      # Authenticate to Google Cloud using Workload Identity Federation
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: '${{ env.WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ env.SERVICE_ACCOUNT }}'

      # Authenticate Docker to Google Artifact Registry
      - name: Docker Auth
        id: docker-auth
        uses: docker/login-action@v3
        with:
          username: 'oauth2accesstoken'
          password: '${{ steps.auth.outputs.access_token }}'
          registry: '${{ env.GAR_LOCATION }}-docker.pkg.dev'

      - name: Build and Push Docker Image
        run: |
          IMAGE_PATH="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_NAME }}/${{ env.SERVICE }}:${{ github.sha }}"
          docker build -t "$IMAGE_PATH" .
          docker push "$IMAGE_PATH"

      # Deploy the image to Google Cloud Run
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_NAME }}/${{ env.SERVICE }}:${{ github.sha }}
          # Uncomment to make the service publicly accessible
          # flags: '--allow-unauthenticated'

      - name: Show Output
        run: echo "Service deployed at ${{ steps.deploy.outputs.url }}"

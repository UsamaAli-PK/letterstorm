server {
    # Listen on port 8080 as required by Google Cloud Run
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Serve static assets directly and fallback to index.html for SPA routing
    location / {
        try_files $uri $uri/ /index.html;
        
        # Add headers to prevent caching issues for the index file
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Enable browser caching for static assets (JS, CSS, Images)
    location ~* \.(?:css|js|ico|jpg|jpeg|png|gif|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Handle 404 errors (should typically be caught by your React Router)
    error_page 404 /index.html;
}
